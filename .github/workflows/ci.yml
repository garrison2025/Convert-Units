name: ExactUnit tests and static SEO audit
on:
  push:
    branches: [main]
    paths-ignore:
      - source.bundle.b64
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test calculation and build all pages
        run: npm run check
      - name: Smoke-test calculator, batch, navigation and numeric pages in headless Chrome
        run: |
          command -v google-chrome || command -v chromium
          node scripts/browser-smoke.mjs
      - name: Validate production canonical, sitemap and full-site links with a synthetic custom origin
        env:
          SITE_URL: https://qa.example.test
        run: npm run build
      - name: Upload small QA reports for manual SEO review
        uses: actions/upload-artifact@v4
        with:
          name: exactunit-quality-reports
          path: |
            dist/keyword-evidence-review.csv
            dist/keyword-evidence-review.json
            dist/seo-content-audit.json
            dist/seo-crawl-audit.json
            dist/release-audit-report.json
            dist/quality-report.json
            dist/performance-budget-report.json
          if-no-files-found: error
          retention-days: 7
