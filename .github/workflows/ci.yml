name: ConvertUnits.cc tests and Google SEO release audit
on:
  push:
    branches: [main]
    paths-ignore:
      - source.bundle.b64
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test calculation and build all pages
        run: npm run check
      - name: Smoke-test calculator, batch, navigation and numeric pages in headless Chrome
        run: |
          command -v google-chrome || command -v chromium
          node scripts/browser-smoke.mjs
      - name: Capture desktop and mobile visual QA screenshots (local build only)
        run: node scripts/visual-capture.mjs
      - name: Upload browser screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: exactunit-visual-qa
          path: qa-snapshots/
          if-no-files-found: error
          retention-days: 7
      - name: Measure Chrome Lighthouse lab performance (not real-user Core Web Vitals)
        run: node scripts/lighthouse-lab-audit.mjs
      - name: Upload reproducible Lighthouse raw and summary reports
        uses: actions/upload-artifact@v4
        with:
          name: exactunit-lighthouse-lab
          path: qa-lighthouse/
          if-no-files-found: error
          retention-days: 7
      - name: Guard against accidental indexing on the actual domain without publication approval
        env:
          SITE_URL: https://convertunits.cc
        run: |
          node scripts/build.mjs
          node --input-type=module -e 'import fs from "node:fs"; const b=JSON.parse(fs.readFileSync("dist/build-info.json")); const h=fs.readFileSync("dist/index.html","utf8"); const m=fs.readFileSync("dist/sitemap.xml","utf8"); const headers=fs.readFileSync("dist/_headers","utf8"); if(b.mode!=="preview"||b.site!==null||b.indexablePages!==0||b.publicationApproved||b.publicationReason!=="awaiting-public-indexing-approval"||!h.includes("noindex,follow")||h.includes("rel=\"canonical\"")||m.includes("<loc>")||!headers.includes("X-Robots-Tag: noindex, nofollow"))throw Error("SITE_URL unexpectedly enabled indexing"); console.log("Launch guard: custom SITE_URL alone remains noindex");'
      - name: Rehearse production canonical, sitemap and full-site links for the real apex (CI only; not deployed)
        env:
          SITE_URL: https://convertunits.cc
          SEO_PUBLIC_HOST: convertunits.cc
          SEO_INDEX_APPROVED: I_APPROVE_PUBLIC_INDEXING
        run: npm run build
      - name: Confirm full 156-URL owner-approved launch and real-domain canonical
        run: |
          node --input-type=module -e 'import fs from "node:fs";const b=JSON.parse(fs.readFileSync("dist/build-info.json"));if(b.mode!=="production"||b.site!=="https://convertunits.cc"||b.indexablePages!==156||b.numericIndexablePages!==92||b.numericPublishedUrls.length!==92||b.numericIndexMode!=="all")throw Error("Owner-approved full release must include 156 real pages and all 92 numeric pages");const xml=fs.readFileSync("dist/sitemap.xml","utf8");const urls=[...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1]);if(urls.length!==156||new Set(urls).size!==156||urls.some(x=>!x.startsWith("https://convertunits.cc/")))throw Error("Official sitemap incomplete or wrong origin");for(const route of ["/","/convert/lbs-to-kg/","/convert/lbs-to-kg/149/","/convert/kg-to-lbs/240/","/methodology/"]){const h=fs.readFileSync("dist"+route+"index.html","utf8");if(!h.includes("index,follow")||h.includes("noindex,follow")||!h.includes("rel=\"canonical\" href=\"https://convertunits.cc"+route+"\""))throw Error("Missing production index and canonical: "+route)}const notFound=fs.readFileSync("dist/404/index.html","utf8");if(!notFound.includes("noindex,follow"))throw Error("404 must not enter Google results");console.log("PUBLIC LAUNCH: 156 canonical eligible pages, including all 92 owner-approved numeric conversions, 404 excluded");'
      - name: Confirm local and branch previews never index as duplicate hosts
        env:
          SITE_URL: https://convertunits.cc
          SEO_PUBLIC_HOST: convertunits.cc
          SEO_INDEX_APPROVED: I_APPROVE_PUBLIC_INDEXING
          CF_PAGES_BRANCH: feature-preview
        run: |
          node scripts/build.mjs
          node --input-type=module -e 'import fs from "node:fs";const info=JSON.parse(fs.readFileSync("dist/build-info.json"));const html=fs.readFileSync("dist/index.html","utf8");if(info.mode!=="preview"||info.indexablePages!==0||!html.includes("noindex,follow")||html.includes("rel=\"canonical\""))throw Error("Branch preview was accidentally opened to indexing");const hdr=fs.readFileSync("dist/_headers","utf8");if(!hdr.includes("https://:project.pages.dev/*\n  X-Robots-Tag: noindex"))throw Error("Cloudflare mirror host guard missing");console.log("Branch preview remains noindex without restricting official domain");'
      - name: Upload small QA reports for manual SEO review
        uses: actions/upload-artifact@v4
        with:
          name: exactunit-quality-reports
          path: qa-reports/
          if-no-files-found: error
          retention-days: 7

      - name: Check public Cloudflare Pages preview from a networked runner (read-only)
        env:
          EXPECTED_MAIN_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: node scripts/live-preview-audit.mjs
      - name: Observe official-domain Google SEO signals without changing publication
        run: node scripts/official-domain-seo-audit.mjs
      - name: Upload actual apex-domain SEO diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: convertunits-official-google-seo-audit
          path: qa-google-seo/official-domain-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload observed Cloudflare preview status (never substitute for local QA)
        uses: actions/upload-artifact@v4
        with:
          name: exactunit-live-preview-audit
          path: qa-live-preview/preview-audit.json
          if-no-files-found: error
          retention-days: 7
