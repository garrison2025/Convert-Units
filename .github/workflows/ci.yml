name: ExactUnit tests and static SEO audit
on:
  push:
    branches: [main]
    paths-ignore:
      - source.bundle.b64
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test calculation and build all pages
        run: npm run check
      - name: Smoke-test calculator, batch, navigation and numeric pages in headless Chrome
        run: |
          command -v google-chrome || command -v chromium
          node scripts/browser-smoke.mjs
      - name: Capture desktop and mobile visual QA screenshots (local build only)
        run: node scripts/visual-capture.mjs
      - name: Upload browser screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: exactunit-visual-qa
          path: qa-snapshots/
          if-no-files-found: error
          retention-days: 7
      - name: Measure Chrome Lighthouse lab performance (not real-user Core Web Vitals)
        run: node scripts/lighthouse-lab-audit.mjs
      - name: Upload reproducible Lighthouse raw and summary reports
        uses: actions/upload-artifact@v4
        with:
          name: exactunit-lighthouse-lab
          path: qa-lighthouse/
          if-no-files-found: error
          retention-days: 7
      - name: Guard against accidental indexing when SITE_URL is set without launch approval
        env:
          SITE_URL: https://qa.example.test
        run: |
          node scripts/build.mjs
          node --input-type=module -e 'import fs from "node:fs"; const b=JSON.parse(fs.readFileSync("dist/build-info.json")); const h=fs.readFileSync("dist/index.html","utf8"); const m=fs.readFileSync("dist/sitemap.xml","utf8"); const headers=fs.readFileSync("dist/_headers","utf8"); if(b.mode!=="preview"||b.site!==null||b.indexablePages!==0||b.publicationApproved||b.publicationReason!=="awaiting-public-indexing-approval"||!h.includes("noindex,follow")||h.includes("rel=\"canonical\"")||m.includes("<loc>")||!headers.includes("X-Robots-Tag: noindex, nofollow"))throw Error("SITE_URL unexpectedly enabled indexing"); console.log("Launch guard: custom SITE_URL alone remains noindex");'
      - name: Validate production canonical, sitemap and full-site links with a synthetic custom origin
        env:
          SITE_URL: https://qa.example.test
          SEO_PUBLIC_HOST: qa.example.test
          SEO_INDEX_APPROVED: I_APPROVE_PUBLIC_INDEXING
        run: npm run build
      - name: Verify official-domain approval alone never publishes unreviewed numeric pages
        run: |
          node --input-type=module -e 'import fs from "node:fs";const x=JSON.parse(fs.readFileSync("dist/build-info.json"));if(x.mode!=="production"||x.numericPilotIndexPages!==15||x.numericIndexablePages!==0||(x.numericPublishedUrls||[]).length)throw Error("Official domain unexpectedly published numeric pages");const h=fs.readFileSync("dist/convert/ft-lbf-to-nm/400/index.html","utf8");if(!h.includes("noindex,follow")||h.includes("rel=\"canonical\""))throw Error("Unreviewed 400 torque page became indexable");console.log("NUMERIC GATE PASS: public core tools eligible, all 92 numeric pages held");'
      - name: Validate independent per-URL numeric approval using two synthetic candidates
        env:
          SITE_URL: https://qa.example.test
          SEO_PUBLIC_HOST: qa.example.test
          SEO_INDEX_APPROVED: I_APPROVE_PUBLIC_INDEXING
          SEO_NUMERIC_PUBLIC_HOST: qa.example.test
          SEO_NUMERIC_INDEX_APPROVED: I_APPROVE_SELECTED_NUMERIC_URLS
          SEO_NUMERIC_APPROVED_URLS: /convert/ft-lbf-to-nm/400/,/convert/kpa-to-psi/108/
        run: |
          npm run build
          node --input-type=module -e 'import fs from "node:fs";const b=JSON.parse(fs.readFileSync("dist/build-info.json"));const approved=new Set(["/convert/ft-lbf-to-nm/400/","/convert/kpa-to-psi/108/"]);if(b.mode!=="production"||b.numericIndexablePages!==2||b.numericPublishedUrls.length!==2||b.numericPublishedUrls.some(x=>!approved.has(x)))throw Error("Numeric allowlist leaked");for(const u of ["/convert/ft-lbf-to-nm/400/","/convert/kpa-to-psi/108/","/convert/m-to-ft/8849/","/convert/kg-to-lbs/240/"]){const h=fs.readFileSync("dist"+u+"index.html","utf8");if(approved.has(u)?!h.includes("index,follow")||h.includes("noindex,follow")||!h.includes("rel=\"canonical\""):!h.includes("noindex,follow")||h.includes("rel=\"canonical\""))throw Error("Unexpected numeric index status: "+u)}console.log("NUMERIC GATE PASS: exact two allowlisted pages and unapproved candidates noindex");'
      - name: Upload small QA reports for manual SEO review
        uses: actions/upload-artifact@v4
        with:
          name: exactunit-quality-reports
          path: qa-reports/
          if-no-files-found: error
          retention-days: 7

      - name: Check public Cloudflare Pages preview from a networked runner (read-only)
        env:
          EXPECTED_MAIN_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: node scripts/live-preview-audit.mjs
      - name: Upload observed Cloudflare preview status (never substitute for local QA)
        uses: actions/upload-artifact@v4
        with:
          name: exactunit-live-preview-audit
          path: qa-live-preview/preview-audit.json
          if-no-files-found: error
          retention-days: 7
